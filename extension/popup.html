<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; --ok: #16a34a; --err: #dc2626; }
    body { margin: 0; width: 260px; padding: 14px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
    .dot.on { background: var(--ok); }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    p { color: GrayText; font-size: 12px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="">Meu Downloader</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="status">Verificando…</span></div>
  <label><input id="enabled" type="checkbox"> Capturar downloads automaticamente</label>
  <p id="hint"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
